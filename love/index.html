<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>顧總請自重</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f6efe6; --muted:#b9ad9f; --gold:#d6b37a; --rose:#ef8fa9; --rose-d:#c9577a;
  --panel:rgba(16,13,20,.82); --line:rgba(214,179,122,.35); --bg:#0d0b10;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.serif{font-family:"Noto Serif TC",serif}
#game{position:relative;width:100%;height:100%;max-width:960px;margin:0 auto;overflow:hidden;user-select:none}
#bg{position:absolute;inset:0;transition:background 1.2s ease;background:#111}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 30%,rgba(0,0,0,.55) 100%)}
#fx{position:absolute;inset:0;pointer-events:none}
#sceneLabel{position:absolute;top:64px;left:16px;font-size:12px;letter-spacing:.2em;color:rgba(255,255,255,.75);text-shadow:0 1px 4px #000}

/* top bar */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:12px 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:5}
#chap{font-size:13px;color:var(--gold);letter-spacing:.1em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border-radius:999px;background:rgba(30,12,24,.75);border:1px solid rgba(239,143,169,.55);box-shadow:0 0 14px rgba(239,143,169,.25)}
#meter .mtxt{display:flex;flex-direction:column;gap:3px}
#meter .mrow{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:#ffd6e1;letter-spacing:.08em}
#pct{font-size:15px;font-weight:900;color:#fff;text-shadow:0 0 8px rgba(239,143,169,.9)}
#pct::after{content:'%';font-size:10px;margin-left:1px}
#meter.bump{animation:mbump .7s ease-out}
@keyframes mbump{30%{transform:scale(1.12);box-shadow:0 0 26px rgba(239,143,169,.8)}}
#meter .heart{font-size:24px;color:var(--rose);filter:drop-shadow(0 0 6px rgba(239,143,169,.7));animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
#bar{position:relative;width:140px;height:10px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#fill{height:100%;width:0;background:linear-gradient(90deg,#f7c1cf,var(--rose),var(--rose-d));box-shadow:0 0 8px var(--rose);transition:width .8s cubic-bezier(.2,.8,.2,1)}
#lvl{font-size:13px;font-weight:700;color:var(--rose);white-space:nowrap}

/* portrait */
#bg{transition:opacity .35s ease}
#bg svg{position:absolute;inset:0;width:100%;height:100%;filter:blur(1.4px) saturate(.95);transform:scale(1.03)}
#portrait{position:absolute;left:50%;bottom:-10px;width:min(400px,92vw,58vh);transform:translateX(-50%) translateY(24px);opacity:0;transition:opacity .45s,transform .45s,filter .45s;pointer-events:none;z-index:2}
#portrait.on{opacity:1;transform:translateX(-50%) translateY(0)}
#portrait.dim{filter:brightness(.6) saturate(.7)}
#portrait svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(0,0,0,.55))}
#portrait.side{width:min(300px,72vw,44vh);bottom:90px}
#portrait.side svg{filter:brightness(0) drop-shadow(0 0 2px var(--rim)) drop-shadow(0 0 16px var(--rim));opacity:.92}
#titleBg{position:absolute;inset:0;z-index:-2}
#titleBg svg{width:100%;height:100%;display:block}
#title::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,6,14,.92) 0%,rgba(10,6,14,.7) 45%,rgba(10,6,14,.1) 100%)}
#title{isolation:isolate;align-items:flex-start;text-align:left;padding-left:max(24px,6vw)}
#title .tag,#title .sub,#title h1{text-shadow:0 2px 10px rgba(0,0,0,.8)}
#title .gallery{justify-content:flex-start;max-width:420px}
#titleArt{position:absolute;right:-30px;bottom:-90px;width:min(460px,70vw,82vh);z-index:-1;animation:in 1s .2s both}
#titleArt svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 30px rgba(0,0,0,.6))}
#endArt{width:150px;height:150px;border-radius:50%;overflow:hidden;border:2px solid var(--rose);box-shadow:0 0 30px rgba(239,143,169,.35);margin-bottom:14px;flex:none;background:#1a1426}
#endArt svg{width:300px;height:auto;margin:-48px 0 0 -75px;display:block}
@media (max-width:640px){
  #title{align-items:center;text-align:center;padding-left:16px}
  #title::before{background:linear-gradient(180deg,rgba(10,6,14,.9) 0%,rgba(10,6,14,.75) 60%,rgba(10,6,14,.35) 100%)}
  #title .gallery{justify-content:center}
  #titleArt{right:50%;transform:translateX(50%);opacity:.45;animation:none}
}

/* dialog */
#dialog{position:absolute;left:12px;right:12px;bottom:14px;min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 20px 18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;z-index:4}
#who{position:absolute;top:-15px;left:18px;padding:4px 16px;border-radius:999px;background:linear-gradient(135deg,#2a2230,#16121a);border:1px solid var(--gold);color:var(--gold);font-size:14px;font-weight:700;letter-spacing:.1em;display:none}
#who.show{display:block}
#who{z-index:1}
#mePic{position:absolute;left:6px;bottom:100%;width:clamp(110px,20vw,170px);aspect-ratio:1/1;overflow:hidden;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
#mePic.on{opacity:1;transform:none}
#mePic img{width:100%;display:block;margin-top:-6%;filter:drop-shadow(0 0 10px rgba(255,140,170,.45))}
#who.me{border-color:var(--rose);color:var(--rose)}
#text{font-size:17px;line-height:1.85;min-height:64px}
#dialog.narr #text{color:#e7ddd0}
#dialog.heart{background:linear-gradient(135deg,rgba(80,20,45,.88),rgba(30,12,28,.9));border-color:rgba(239,143,169,.6)}
#dialog.heart #text{font-family:"Noto Serif TC",serif;font-style:italic;color:#ffd6e1}
#dialog.heart #who{border-color:var(--rose);color:#ffd6e1;background:#3a1428}
#next{position:absolute;right:16px;bottom:10px;font-size:12px;color:var(--gold);opacity:0;animation:bob 1s infinite}
#dialog.ready #next{opacity:.9}
@keyframes bob{50%{transform:translateY(3px)}}

/* choices */
#choices{position:absolute;inset:0;display:none;flex-direction:column;justify-content:safe center;align-items:center;gap:12px;padding:70px 16px 180px;overflow-y:auto;background:rgba(8,6,10,.45);z-index:6}
#choices.show{display:flex}
#choices .q{font-size:13px;color:var(--gold);letter-spacing:.3em;margin-bottom:4px}
.opt{width:100%;max-width:560px;text-align:left;background:rgba(22,18,26,.9);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:transform .15s,border-color .2s,background .2s;opacity:0;transform:translateY(10px);animation:in .35s forwards}
.opt:hover,.opt:focus-visible{border-color:var(--rose);background:rgba(60,22,40,.92);outline:none;transform:translateX(4px)}
.opt b{color:var(--gold);margin-right:8px;font-family:"Noto Serif TC",serif}
@keyframes in{to{opacity:1;transform:none}}

/* floating delta */
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;color:var(--rose);text-shadow:0 0 20px rgba(239,143,169,.8);pointer-events:none;z-index:9;animation:up 1.6s forwards}
.float.neg{color:#8fa6c9;text-shadow:0 0 20px rgba(120,150,200,.7)}
@keyframes up{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}

/* chapter card & screens */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;z-index:10}
.screen.show{display:flex}
#card{background:rgba(5,4,7,.88);cursor:pointer}
#card .no{font-size:13px;letter-spacing:.5em;color:var(--gold);opacity:0;animation:in .8s .1s forwards}
#card h2{font-size:clamp(26px,6vw,40px);margin:14px 0;opacity:0;animation:in .9s .4s forwards}
#card p{color:var(--muted);font-size:13px;opacity:0;animation:in .8s 1s forwards}

#title{background:radial-gradient(ellipse at 50% 20%,#3a2030 0%,#140e16 55%,#08070a 100%)}
#title .sub{color:var(--gold);letter-spacing:.5em;font-size:13px}
#title h1{font-size:clamp(40px,11vw,76px);font-weight:900;margin:12px 0 6px;background:linear-gradient(180deg,#fff3e0,#d6b37a 70%,#a07a44);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(214,179,122,.3))}
#title .tag{color:var(--muted);font-size:14px;line-height:1.9;max-width:420px;margin-bottom:26px}
.field{display:flex;gap:10px;align-items:center;margin-bottom:18px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px}
.field label{font-size:13px;color:var(--gold);white-space:nowrap}
.field input{background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;width:120px;outline:none;text-align:center}
.btn{background:linear-gradient(135deg,#e7c48a,#b98a4c);color:#1a1209;border:0;border-radius:999px;padding:13px 40px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.2em;cursor:pointer;box-shadow:0 8px 24px rgba(214,179,122,.25);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.gallery{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gallery span{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.35)}
.gallery span.got{border-color:var(--rose);color:var(--rose)}

#end{background:rgba(6,5,8,.9);overflow-y:auto;justify-content:flex-start;padding-top:48px}
#end .badge{font-size:12px;letter-spacing:.4em;color:var(--gold)}
#end .badge.secret{color:#1a1209;background:linear-gradient(135deg,#e7c48a,#ef8fa9);padding:4px 14px;border-radius:999px;animation:beat 1.4s infinite}
#endArt img.npcimg{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.8);transform-origin:50% 20%}
.gallery span.got.secret{border-color:var(--gold);color:var(--gold)}
#end h2{font-size:clamp(30px,7vw,46px);margin:10px 0 4px;color:#ffe6ee}
#end .score{color:var(--rose);font-size:15px;margin-bottom:20px}
#end .story{max-width:560px;text-align:left;line-height:2;color:#e9ded2;font-size:15px}
#end .quote{max-width:560px;margin:20px 0;padding:16px 20px;border-left:3px solid var(--rose);background:rgba(239,143,169,.08);text-align:left;font-family:"Noto Serif TC",serif;color:#ffd6e1;line-height:1.9}
#end .hint{color:var(--muted);font-size:13px;margin-bottom:18px}
#review{max-width:560px;width:100%;text-align:left;margin:6px 0 24px;font-size:13px;color:var(--muted)}
#review summary{cursor:pointer;color:var(--gold);margin-bottom:8px}
#review li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
#review li em{font-style:normal;color:var(--rose);white-space:nowrap}
#review li em.neg{color:#8fa6c9}
#review li small.ctx{display:block;color:var(--gold);font-size:11px;margin-top:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}

@media (max-width:520px){
  #text{font-size:15.5px}
  #dialog{min-height:140px;padding:24px 16px 16px}
  #portrait{bottom:70px}
  #bar{width:78px}
  #meter{padding:5px 10px 5px 8px;gap:7px}
  #meter .heart{font-size:19px}
  #lvl{font-size:12px}
  .opt{font-size:14px;padding:12px 14px}
}

/* ===== 待機動畫 ===== */
#portrait svg{animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.012) translateY(-2px)}}
.lid{opacity:0;animation:blink 5.2s infinite}
@keyframes blink{0%,93%,100%{opacity:0}94.5%,97%{opacity:1}}
#portrait.side svg{animation:none}
/* 特寫 */
#portrait{transform-origin:50% 30%}
#portrait.on.close{transform:translateX(-50%) translateY(-6%) scale(1.45)}
#bg svg{transition:transform 1.2s ease,filter 1.2s ease}
#bg.close svg{transform:scale(1.15);filter:blur(4px) brightness(.8)}
/* 閃光、音效字、飛濺、愛心 */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8}
.bang{position:absolute;left:50%;top:34%;z-index:9;pointer-events:none;font-size:clamp(64px,16vw,130px);font-weight:900;color:#fff;-webkit-text-stroke:4px #1a1016;paint-order:stroke fill;text-shadow:6px 6px 0 #c9577a,0 0 30px rgba(255,255,255,.6);letter-spacing:.05em;white-space:nowrap}
.splat{position:absolute;width:280px;height:200px;border-radius:50%;pointer-events:none;z-index:8;filter:blur(2px)}
.drop{position:absolute;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;pointer-events:none;z-index:8}
.bheart{position:absolute;pointer-events:none;z-index:9;text-shadow:0 0 12px rgba(255,120,160,.8)}
/* 覆蓋層 */
.overlay{position:absolute;inset:0;z-index:11;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.overlay .tap{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--gold);letter-spacing:.2em;opacity:0}
/* 手機 */
#phone{background:rgba(5,4,8,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#phone .device{position:relative;width:min(330px,86vw);height:min(560px,76vh);border-radius:40px;background:#f3eef2;border:10px solid #111;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 2px #333;display:flex;flex-direction:column;overflow:hidden}
#phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:110px;height:24px;background:#111;border-radius:0 0 16px 16px;z-index:2}
#phone .phead{display:flex;align-items:center;gap:10px;padding:34px 16px 12px;background:#fff;border-bottom:1px solid #e5dde3;color:#222}
#phone .phead b{display:block;font-size:15px}
#phone .phead small{font-size:11px;color:#999}
#phone .pav{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#2a2230;flex:none}
#phone .pav svg{width:110px;margin:-12px 0 0 -35px;display:block}
#phone .msgs{flex:1;overflow-y:auto;padding:16px 12px 40px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(#f6f1f5,#efe7ee)}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.55;color:#222;animation:pop .25s ease-out}
.bub.him{align-self:flex-start;background:#fff;border-top-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,#f7a6bf,#ef8fa9);color:#fff;border-top-right-radius:4px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.dots{display:inline-flex;gap:4px;padding:3px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:#bbb;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
#phone .device .tap{bottom:10px;color:#b07a8c}
/* CG */
#cg{z-index:13;background:radial-gradient(ellipse at center,rgba(60,20,40,.85),rgba(5,3,8,.95));flex-direction:column}
.cgcard{position:relative;width:min(860px,94vw);aspect-ratio:16/10;max-height:72vh;border-radius:14px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 6px rgba(214,179,122,.15),0 0 60px rgba(239,143,169,.4),0 30px 80px rgba(0,0,0,.6)}
.cgart{position:absolute;inset:0;overflow:hidden;background:#111}
.cgart > *{position:absolute;inset:0;width:100%;height:100%}
.cgbg svg{width:100%;height:100%;display:block;filter:blur(2px)}
.cgchar{display:flex;justify-content:center;align-items:flex-start;transform-origin:50% 25%}
.cgchar svg{width:auto;height:165%;margin-top:0}
.cgart > svg{pointer-events:none}
.rainfx{background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(220,230,255,.28) 22px 23px);background-size:200% 200%;animation:rainmove .5s linear infinite}
@keyframes rainmove{to{background-position:-60px 120px}}
.steam path{animation:steam 2.4s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.6s}.steam path:nth-child(3){animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(20px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-30px)}}
.sparkles{background-image:radial-gradient(circle,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle,#ffd6e1 0 1px,transparent 2px);background-size:90px 110px,60px 70px;background-position:0 0,30px 40px;animation:twinkle 3s ease-in-out infinite;mix-blend-mode:screen}
@keyframes twinkle{50%{opacity:.3;background-position:10px -10px,40px 30px}}
.cgfw{mix-blend-mode:screen}
.shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:shine 2.8s .9s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.cgcap{position:absolute;left:0;right:0;bottom:0;padding:50px 22px 18px;background:linear-gradient(transparent,rgba(10,5,12,.88));text-align:left}
.cgtag{font-size:12px;letter-spacing:.3em;color:var(--rose)}
.cgnew{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--rose);color:#fff;letter-spacing:.1em;font-size:10px;animation:beat 1.4s infinite}
.cgtitle{font-size:clamp(22px,4.5vw,34px);font-weight:900;color:#fff;margin:4px 0 2px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.cgline{color:#ffd6e1;font-size:clamp(14px,2.6vw,17px)}
@media (max-width:640px){.cgcard{aspect-ratio:3/4;max-height:70vh}.cgchar svg{height:118%}}
/* 相冊 */
#album{background:rgba(8,6,10,.96);justify-content:flex-start;overflow-y:auto;padding-top:40px;z-index:12}
#album h2{font-size:30px;color:var(--gold)}
#album .count{color:var(--muted);font-size:13px;margin:6px 0 20px}
#album .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;max-width:760px;margin-bottom:24px}
.thumb{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#1a1420;cursor:pointer;padding:0;font:inherit}
.thumb .cgart{pointer-events:none}
.thumb .cgart .cgchar svg{height:200%}
.thumb span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.thumb.lock{cursor:default;display:flex;align-items:center;justify-content:center}
.thumb.lock::before{content:"🔒";font-size:22px;opacity:.4}
.thumb.lock span{color:var(--muted)}
.row2{display:flex;gap:12px;flex-wrap:wrap}
.modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mode{font:inherit;cursor:pointer;text-align:left;padding:9px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:var(--muted);line-height:1.35;transition:.2s}
.mode b{display:block;font-size:14px;color:var(--ink);font-weight:700}
.mode small{font-size:11.5px}
.mode:hover{border-color:rgba(214,179,122,.5)}
.mode.on{border-color:var(--gold);background:rgba(214,179,122,.14);box-shadow:0 0 18px rgba(214,179,122,.18)}
.mode.on b{color:var(--gold)}
@media (max-width:640px){.modes{justify-content:center}.mode{text-align:center}}

/* AI 圖片 */
#portrait img.npcimg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px var(--rim,rgba(0,0,0,.55)));animation:breathe 4.2s ease-in-out infinite;transform-origin:50% 100%}
#portrait img.guimg,#titleArt img.guimg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 18px rgba(0,0,0,.55))}

.emote.e-blush{color:#ff8fb0}
.emote.e-smirk{color:#ffe08a}
.emote.e-smile{color:#ffd6e1}
@keyframes emotePop{from{transform:scale(0) rotate(-30deg);opacity:0}}
@keyframes emoteFloat{50%{transform:translateY(-6px) rotate(6deg)}}
.cheeks{position:absolute;left:31%;top:30.5%;width:34%;height:7%;background:radial-gradient(ellipse 22% 50% at 22% 50%,rgba(255,110,150,.55),transparent),radial-gradient(ellipse 22% 50% at 78% 50%,rgba(255,110,150,.55),transparent);mix-blend-mode:multiply;animation:fadein .6s both;pointer-events:none}

.cgart img.cgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;animation:kenburns 8s ease-out both}

<script>
/* ---------------- 顧衍舟立繪 ---------------- */
// 顧衍舟立繪產生器：guSVG(expr)  expr = cold | smirk | smile | blush | angry
function guSVG(expr = 'cold', uid = 'g', fem = false) {
  const E = {
    cold:  {brow: 4,  open: 1.0, look: 0,  lowLift: 0, mouth: 'flat',  blush: 0},
    smirk: {brow: 1,  open: 0.9, look: -1, lowLift: 1, mouth: 'smirk', blush: 0, browUp: 1},
    smile: {brow: -1, open: 0.85,look: 0,  lowLift: 3, mouth: 'smile', blush: 0.25},
    blush: {brow: -2, open: 0.9, look: 5,  lowLift: 1, mouth: 'shy',   blush: 1},
    angry: {brow: 8,  open: 0.75,look: 0,  lowLift: 1, mouth: 'frown', blush: 0},
  }[expr] || {};
  const id = s => uid + s;

  // 一束頭髮：從 (ax,ay)-(bx,by) 的根部，垂到尖端 (tx,ty)，bend 控制彎度
  const lock = (ax, ay, bx, by, tx, ty, bend = 0, fill = `url(#${id('hair')})`) => {
    const c1x = (ax + tx) / 2 + bend, c1y = (ay + ty) / 2;
    const c2x = (bx + tx) / 2 + bend * 0.6, c2y = (by + ty) / 2;
    return `<path d="M${ax} ${ay} Q${c1x} ${c1y} ${tx} ${ty} Q${c2x} ${c2y} ${bx} ${by} Z" fill="${fill}"/>`;
  };

  // 眼睛：side=-1 左（畫面左）/ 1 右
  const eye = side => {
    const cx = 200 + side * 29, inner = cx - side * 19, outer = cx + side * 22;
    const yIn = 207, yOut = 198;                    // 外眼角上挑
    const top = 195 + (1 - E.open) * 10;            // 上眼瞼高度
    const low = 212 - E.lowLift;
    const shape = `M${outer} ${yOut} C${cx + side * 10} ${top} ${cx - side * 8} ${top + 1} ${inner} ${yIn} C${cx - side * 6} ${low} ${cx + side * 10} ${low} ${outer} ${yOut} Z`;
    const ix = cx + E.look - side * 1, iy = 206;
    return `
      <clipPath id="${id('e' + side)}"><path d="${shape}"/></clipPath>
      <path d="${shape}" fill="#f4f1f4"/>
      <g clip-path="url(#${id('e' + side)})">
        <ellipse cx="${ix}" cy="${iy}" rx="11.5" ry="13.5" fill="url(#${id('iris')})"/><ellipse cx="${ix}" cy="${iy}" rx="11" ry="13" fill="none" stroke="#05060c" stroke-width="1.6"/>
        <ellipse cx="${ix}" cy="${iy + 1}" rx="3.6" ry="5.5" fill="#07070c"/>
        <ellipse cx="${ix}" cy="${iy + 7}" rx="6" ry="3" fill="#a9c2f0" opacity=".5"/>
        <circle cx="${ix + 3}" cy="${iy - 4}" r="2.6" fill="#fff"/>
        <circle cx="${ix - 3.5}" cy="${iy + 4}" r="1.1" fill="#fff" opacity=".85"/>
        <path d="M${outer - side * 30} ${top - 4} L${outer + side * 4} ${top - 4} L${outer + side * 4} ${top + 6} L${outer - side * 30} ${top + 6} Z" fill="#000" opacity=".12"/>
      </g>
      <path d="M${outer + side * 5} ${yOut - 3} C${cx + side * 10} ${top - 4} ${cx - side * 8} ${top - 3} ${inner + side * 1} ${yIn - 1} L${inner} ${yIn + 1} C${cx - side * 8} ${top + 2} ${cx + side * 10} ${top + 1} ${outer} ${yOut + 1.5} Z" fill="#101016"/>
      <path d="M${inner - side * 1} ${yIn + 2} C${cx - side * 6} ${low + 1} ${cx + side * 10} ${low + 1} ${outer - side * 3} ${yOut + 6}" stroke="#7b5a55" stroke-width="1.1" fill="none" opacity=".8"/>
      <path d="M${cx + side * 14} ${top - 7} C${cx + side * 2} ${top - 10} ${cx - side * 10} ${top - 8} ${inner} ${yIn - 6}" stroke="#c99683" stroke-width="1" fill="none" opacity=".6"/>
      <path d="M${outer} ${yOut - 1} L${outer + side * 10} ${yOut - 7} L${outer + side * 3} ${yOut + 3} Z" fill="#101016"/>
      <g class="lid" opacity="0">
        <path d="${shape}" fill="#f8e0d1" stroke="#f8e0d1" stroke-width="9" stroke-linejoin="round"/>
        <path d="M${outer + side * 4} ${yOut + 1} C${cx + side * 10} ${low + 1} ${cx - side * 6} ${low + 1} ${inner} ${yIn + 1}" stroke="#101016" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      </g>`;
  };

  // 眉毛
  const brow = side => {
    const cx = 200 + side * 28, inner = cx - side * 20, outer = cx + side * 24;
    const yi = 180 + E.brow * 0.9 - (E.browUp && side === 1 ? 5 : 0);
    const yo = 176 - E.brow * 0.3 - (E.browUp && side === 1 ? 4 : 0);
    return `<path d="M${inner} ${yi} C${cx} ${yi - 7} ${outer - side * 6} ${yo - 6} ${outer} ${yo} C${outer - side * 8} ${yo - 2} ${cx} ${yi - 3} ${inner} ${yi + 4} Z" fill="#15141c"/>`;
  };

  const mouths = {
    flat:  `<path d="M190 268 C196 269.5 204 269.5 211 267.5" stroke="#9c5d58" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    smirk: `<path d="M189 269 C197 270 205 269 213 263" stroke="#9c5d58" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M212 262 L215 264" stroke="#9c5d58" stroke-width="1.4" stroke-linecap="round"/>`,
    smile: `<path d="M187 265 C194 272 207 272 214 265" stroke="#9c5d58" stroke-width="2" fill="none" stroke-linecap="round"/>`,
    shy:   `<path d="M192 269 C196 267 199 271 203 268 C206 266 208 269 210 268" stroke="#9c5d58" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
    frown: `<path d="M190 271 C196 267 205 267 211 271" stroke="#9c5d58" stroke-width="2" fill="none" stroke-linecap="round"/>`,
  };

  const lips = fem ? `<path d="M189 268.5 C194 266 198 267 200 268 C202 267 206 266 212 268 C207 275 194 275 189 268.5 Z" fill="#c4384f" opacity="${E.mouth === 'shy' ? .55 : .75}"/><ellipse cx="203" cy="271.5" rx="3.5" ry="1.2" fill="#fff" opacity=".35"/>` : '';
  const lashes = fem ? [-1, 1].map(side => { const ox = 200 + side * 51, oy = 197; return `<path d="M${ox} ${oy} l${side * 9} -8 M${ox - side * 6} ${oy - 4} l${side * 6} -9 M${ox - side * 13} ${oy - 6} l${side * 3} -8" stroke="#101016" stroke-width="2" stroke-linecap="round"/>`; }).join('') : '';
  const blush = E.blush ? `
    <g opacity="${E.blush}">
      <ellipse cx="164" cy="234" rx="17" ry="7" fill="#f28ca2" opacity=".45"/>
      <ellipse cx="236" cy="234" rx="17" ry="7" fill="#f28ca2" opacity=".45"/>
      ${E.blush >= 1 ? `<path d="M154 236 L159 229 M162 237 L167 230 M170 237 L175 230 M226 236 L231 229 M234 237 L239 230 M242 237 L247 230" stroke="#e46b88" stroke-width="1.5" stroke-linecap="round"/>` : ''}
    </g>` : '';
  const angryShade = expr === 'angry'
    ? `<path d="M262 118 C266 112 272 112 274 118 M262 126 C266 132 272 132 274 126 M258 122 L254 122 M278 122 L282 122" stroke="#b5485e" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>` : '';

  return `<svg viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="${id('skin')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde9dc"/><stop offset="1" stop-color="#f3d2bf"/></linearGradient>
  <linearGradient id="${id('hair')}" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="${fem ? '#5a3442' : '#363a52'}"/><stop offset=".45" stop-color="${fem ? '#26141c' : '#191a25'}"/><stop offset="1" stop-color="${fem ? '#0f080b' : '#0b0b11'}"/></linearGradient>
  <linearGradient id="${id('suit')}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30303b"/><stop offset=".5" stop-color="#17171e"/><stop offset="1" stop-color="#0a0a0e"/></linearGradient>
  <linearGradient id="${id('tie')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f0c19"/><stop offset=".5" stop-color="#8a1c31"/><stop offset="1" stop-color="#4f0c19"/></linearGradient>
  <linearGradient id="${id('iris')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0c16"/><stop offset=".5" stop-color="#222c4a"/><stop offset="1" stop-color="#7895cf"/></linearGradient>
  <linearGradient id="${id('shirt')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6dbe6"/></linearGradient>
  <radialGradient id="${id('rim')}" cx=".5" cy=".3" r=".7"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
</defs>

<!-- 後髮 -->
<path d="M128 214 C110 140 140 56 206 52 C274 52 302 140 274 214 Z" fill="url(#${id('hair')})"/>
${fem ? `<path d="M124 170 C104 250 100 330 112 420 L288 420 C300 330 296 250 276 170 Z" fill="url(#${id('hair')})"/>` : ''}

<!-- 脖子 -->
<path d="M181 268 L219 268 L226 340 L174 340 Z" fill="#f0cbb5"/>

<!-- 西裝 -->
<path d="M18 600 C22 452 74 372 160 344 L200 360 L240 344 C326 372 378 452 382 600 Z" fill="url(#${id('suit')})"/>

${fem ? `<!-- 絲質上衣＋項鍊 -->
<path d="M160 338 L200 430 L240 338 L250 360 L200 500 L150 360 Z" fill="#f4ece4"/>

<path d="M190 392 L210 386 M189 422 L212 416 M187 452 L214 446 M186 482 L215 476" stroke="#b0455c" stroke-width="2" opacity=".35"/>`}
<!-- 領片 -->
<path d="M160 344 L200 488 L186 512 L112 410 L136 398 L114 380 Z" fill="#1e1e26"/>

<path d="M160 344 L200 488 M240 344 L200 488" stroke="#44444f" stroke-width="1.6"/>

<circle cx="134" cy="420" r="5" fill="#d9b67b"/><circle cx="133" cy="418.5" r="1.6" fill="#fff6dd"/>

<g transform="translate(200 214) scale(1.1) translate(-200 -214)">

<!-- 臉 -->
<path d="M142 168 C140 214 150 244 170 268 C182 282 192 292 200 294 C208 292 218 282 230 268 C250 244 260 214 258 168 C256 108 230 84 200 84 C170 84 144 108 142 168 Z" fill="url(#${id('skin')})"/>
<path d="M250 210 C248 240 236 262 214 288 C234 274 252 250 257 206 Z" fill="#e4b39b" opacity=".55"/>

${brow(-1)}${brow(1)}
${eye(-1)}${eye(1)}${lashes}

<!-- 鼻子 -->
<path d="M196 206 C197 222 197 234 199 244" stroke="#e3b29c" stroke-width="4" opacity=".45" stroke-linecap="round"/><path d="M204 216 L207 242" stroke="#d3a28d" stroke-width="1.4" stroke-linecap="round"/><ellipse cx="204" cy="240" rx="2.4" ry="1.6" fill="#fff" opacity=".6"/>
<path d="M207 243 C205 247 200 248 196 246" stroke="#bf8a75" stroke-width="1.6" fill="none" stroke-linecap="round"/>

${lips}${mouths[E.mouth] || mouths.flat}
<path d="M195 279 C198 281.5 203 281.5 206 279" stroke="#d99a8c" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
${blush}

<!-- 外圍蓬鬆髮束 -->
${lock(136, 126, 162, 84, 120, 100, -4)}

<!-- 兩側短髮、鬢角 -->
${lock(124, 140, 148, 168, 132, 218, -2)}

<path d="M126 150 C106 230 112 330 150 420 C140 360 142 300 156 250 C150 210 148 180 150 160 Z" fill="url(#${id('hair')})"/>
<path d="M274 150 C294 230 288 330 250 420 C260 360 258 300 244 250 C250 210 252 180 250 160 Z" fill="url(#${id('hair')})"/>

<clipPath id="${id('face')}"><path d="M142 168 C140 214 150 244 170 268 C182 282 192 292 200 294 C208 292 218 282 230 268 C250 244 260 214 258 168 C256 108 230 84 200 84 C170 84 144 108 142 168 Z"/></clipPath>

<!-- 髮絲高光 -->

function guEmote(expr){
  const A = art();
  if (!A.sprite.cold || A.sprite[expr] || !EMOTE[expr]) return '';

  if (S.swap && !p.keep) p.g = p.g === 'm' ? 'f' : 'm';   // 反轉版：除了奶奶，所有人性別互換
  const longHair = p.g==='f' && !p.short && !p.bun
    ? `<path d="M52 92 C40 150 44 200 58 236 L142 236 C156 200 160 150 148 92 Z" fill="${p.hair}"/>` : '';
  const body = p.g==='m'
    ? `<path d="M18 260 C22 205 52 182 100 178 C148 182 178 205 182 260 Z" fill="${p.suit}"/>
       <path d="M80 180 L100 232 L120 180 Z" fill="${p.shirt}"/>
       <path d="M96 186 L104 186 L107 222 L100 232 L93 222 Z" fill="${p.tie}"/>
       <path d="M80 180 L100 232 L72 196 Z" fill="rgba(0,0,0,.25)"/><path d="M120 180 L100 232 L128 196 Z" fill="rgba(0,0,0,.25)"/>`
    : `<path d="M22 260 C28 208 58 186 100 182 C142 186 172 208 178 260 Z" fill="${p.suit}"/>
       <path d="M84 184 Q100 206 116 184 Z" fill="${p.skin}"/>`;
  const hairTop = p.g==='m'
    ? `<path d="M58 96 C54 56 82 38 104 40 C132 42 150 62 144 100 C138 80 126 72 112 70 C96 80 76 80 62 78 Z" fill="${p.hair}"/>`
    : p.bun
      ? `<circle cx="100" cy="44" r="18" fill="${p.hair}"/><path d="M60 100 C56 60 80 50 100 50 C120 50 144 60 140 100 C134 80 118 70 100 70 C82 70 66 80 60 100 Z" fill="${p.hair}"/>`
      : `<path d="M56 110 C50 58 80 40 102 40 C130 40 152 60 146 112 C140 84 120 68 98 70 C82 76 70 90 56 110 Z" fill="${p.hair}"/>`;
  const glasses = p.glasses ? `<g stroke="#222" stroke-width="2.5" fill="none"><rect x="72" y="102" width="22" height="14" rx="4"/><rect x="106" y="102" width="22" height="14" rx="4"/><path d="M94 108 L106 108"/></g>` : '';
  const cheeks = blush ? `<ellipse cx="78" cy="126" rx="10" ry="5" fill="#f08aa3" opacity=".55"/><ellipse cx="122" cy="126" rx="10" ry="5" fill="#f08aa3" opacity=".55"/>` : '';
  return `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sk${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.skin}"/><stop offset="1" stop-color="#c9a48f"/></linearGradient></defs>

    ${hairTop}${glasses}${cheeks}

}

/* 顯示一行台詞 */
function showLine(raw){
  const i = raw.indexOf('|');

  } else if (who === 'heart'){
    dlg.classList.add('heart'); tag.classList.add('show'); tag.textContent = `♥ ${fill(PEOPLE.gu.n)}的心聲`;
    const d = S.lastDelta;
    showPortrait('gu', d >= 10 ? 'blush' : d >= 6 ? 'smile' : d >= 2 ? 'smirk' : 'cold');
  } else if (who === 'me'){

}

function play(lines, done){ queue = lines; qi = 0; onDone = done; nextLine(); }
function nextLine(){
  if (qi >= queue.length){ const d = onDone; onDone = null; d && d(); return; }
  let raw = queue[qi++];
  // 條件台詞：「?旗標>台詞」有這個旗標才出現，「!旗標>台詞」沒有才出現（多個旗標用空白分隔，任一符合即可）
  if (raw[0] === '?' || raw[0] === '!'){
    const k = raw.indexOf('>'), want = raw[0] === '?';
    if (hasFlag(raw.slice(1, k)) !== want) return nextLine();
    raw = raw.slice(k + 1);
  }
  const kind = raw.slice(0, raw.indexOf('|')), arg = raw.slice(raw.indexOf('|') + 1);
  if (kind === 'fx'){ runFx(arg); return nextLine(); }
  if (kind === 'phone') return showPhone(arg, nextLine);
  if (kind === 'cg') return showCG(arg, nextLine);
  showLine(raw);
}

function miniFireworks(cvs){
  const ctx = cvs.getContext('2d'); let ps = [], t = 0;
  const fit = () => { cvs.width = cvs.clientWidth; cvs.height = cvs.clientHeight; }; fit();
  const tick = () => {
    if (!cvs.isConnected || !$('cg').classList.contains('show')) return;
    t++;
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(0, 0, cvs.width, cvs.height); ctx.globalCompositeOperation = 'lighter';
    if (t % 35 === 1){ const x = cvs.width * (.15 + Math.random() * .7), y = cvs.height * (.1 + Math.random() * .3), hue = [340, 45, 200, 290][t % 4];
      for (let i = 0; i < 60; i++){ const a = Math.random() * 6.28, s = 1 + Math.random() * 3; ps.push({x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, l:1, hue}); } }
    ps = ps.filter(p => p.l > 0);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.l -= .014; ctx.fillStyle = `hsla(${p.hue},90%,65%,${p.l})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, 6.28); ctx.fill(); });
    requestAnimationFrame(tick);
  };
  tick();
}

// 選項的 alt：前面有某個旗標時，換成另一組心動值／劇情／心聲（同一句話，情境不同，效果不同）
function resolve(o){ return o.alt && hasFlag(o.alt.if) ? {...o, ...o.alt} : o; }

function choose(c, o){
  $('choices').classList.remove('show');
  const ctx = !!(o.alt && hasFlag(o.alt.if));   // 這次是不是因為前面的選擇而改變了結果
  o = resolve(o);
  (o.set || '').split(' ').filter(Boolean).forEach(f => S.flags.add(f));
  S.lastDelta = o.d;
  S.picks.push({ch:c.title, t:o.t, d:o.d, ctx});
  S.lastTags = (o.tag || '').split(' ').filter(Boolean);
  S.lastTags.forEach(k => S.tags[k] = T(k) + 1);
  setHeart(S.heart + o.d);
  floatDelta(o.d);
  if (o.d >= 10) heartBurst(); else if (o.d < 0) heartBreak();
  busy = true;
  setTimeout(() => { busy = false; play([...o.r, 'heart|' + o.h, ...(c.after || [])], () => runChapter(S.ch + 1)); }, 750);
}

/* 結局 */
function showEnding(){
  const e = ENDINGS.find(x => x.hidden ? x.when() : S.heart >= x.min);
  hidePortrait();
  setZoom(false);
  setScene(e.bg || (e.id === 'normal' ? 'morning' : 'roof'));
  setFx(e.fx);
  const A = art(), pic = e.who === 'me' ? A.me.panic : e.who && A.people[e.who];
  $('endArt').innerHTML = pic ? `<img class="npcimg" src="${pic}" alt="" draggable="false">`
    : e.who ? avatar(e.who) : guArt(e.face, 'end');
  const isNew = !getUnlocked().includes(e.id);
  $('endBadge').textContent = e.hidden ? (isNew ? '✦ 發現隱藏結局 ✦' : '隱藏結局') : '結局';
  $('endBadge').classList.toggle('secret', !!e.hidden);
  $('endTitle').textContent = fill(e.title);
  $('endScore').textContent = `最終心動值 ❤ ${S.heart} / 100`;
  const epi = e.epi ? EPILOGUE.filter(([f]) => S.flags.has(f)).map(x => x[1]) : [];
  $('endStory').innerHTML = fill(e.story) + (epi.length ? '<br><br><b style="color:var(--gold)">後來——</b><br>' + epi.join('<br>') : '');
  $('endQuote').textContent = fill(e.quote);
  // 沒拿到隱藏結局時，隨機給一句還沒解鎖的隱藏結局線索
  const u = getUnlocked(), left = ENDINGS.filter(x => x.hidden && !u.includes(x.id) && x.id !== e.id).length;
  const tease = !e.hidden && left ? `　這個故事還有 ${left} 個隱藏結局。${fill(HIDDEN_HINTS[Math.floor(Math.random() * HIDDEN_HINTS.length)])}` : '';
  $('endHint').textContent = fill(e.hint || '') + tease;
  $('reviewList').innerHTML = S.picks.map((p, i) =>
    `<li><span>${NUM[i]}．${fill(p.t)}${p.ctx ? '<small class="ctx">↺ 因為你之前的選擇，這次結果不同</small>' : ''}</span><em class="${p.d < 0 ? 'neg' : ''}">${p.d > 0 ? '+' : ''}${p.d}</em></li>`).join('');
  unlock(e.id);
  $('end').scrollTop = 0;
  $('end').classList.add('show');
}

/* 結局收藏（存在瀏覽器） */
function getUnlocked(){ try { return JSON.parse(localStorage.getItem(KEY('gu_endings')) || '[]'); } catch(e){ return []; } }
function unlock(id){ try { const u = getUnlocked(); if (!u.includes(id)){ u.push(id); localStorage.setItem(KEY('gu_endings'), JSON.stringify(u)); } } catch(e){} }
function renderGallery(){
  const u = getUnlocked();
  $('gallery').innerHTML = `<span style="border:0;color:var(--muted)">結局收藏 ${u.filter(id => ENDINGS.some(e => e.id === id)).length}/${ENDINGS.length}</span>` +
    ENDINGS.map(e => `<span class="${u.includes(e.id) ? 'got' : ''}${e.hidden ? ' secret' : ''}">${u.includes(e.id) ? fill(e.title) : e.hidden ? '✦ 隱藏' : '？？？'}</span>`).join('');
}

function start(){
  const def = S.swap ? '蘇言' : '蘇念';
  S.name = ($('nameInput').value || def).trim() || def;
  S.picks = []; S.lastDelta = 0; S.tags = {}; S.lastTags = []; S.flags = new Set(); setHeart(0);
  $('title').classList.remove('show'); $('end').classList.remove('show');
  runChapter(0);
}
$('startBtn').onclick = start;
$('albumBtn').onclick = openAlbum;
$('albumClose').onclick = () => { $('album').classList.remove('show'); $('album').querySelector('.grid').innerHTML = ''; };
$('againBtn').onclick = start;
$('homeBtn').onclick = () => { $('end').classList.remove('show'); setFx(null); renderGallery(); $('title').classList.add('show'); };
$('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

/* ---------------- 特效：雨 / 星空 / 煙火 / 花瓣 ---------------- */
const cv = $('fx'), cx = cv.getContext('2d');
let fxMode = null, parts = [], raf = 0;
function resize(){ const r = $('game').getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize', resize); resize();
function W(){ return cv.width / devicePixelRatio; } function H(){ return cv.height / devicePixelRatio; }

function setFx(m){
  fxMode = m; parts = [];
  if (m === 'rain') for (let i = 0; i < 160; i++) parts.push({x:Math.random()*W(), y:Math.random()*H(), v:8+Math.random()*8, l:10+Math.random()*16});
  if (m === 'stars') for (let i = 0; i < 90; i++) parts.push({x:Math.random()*W(), y:Math.random()*H()*0.7, r:Math.random()*1.4+.3, p:Math.random()*6});
  if (m === 'petals') for (let i = 0; i < 40; i++) parts.push(newPetal(true));
  cancelAnimationFrame(raf);
  cx.clearRect(0, 0, W(), H());
  if (m) loop();
}
function newPetal(any){ return {x:Math.random()*W(), y:any ? Math.random()*H() : -20, vx:-.4+Math.random()*.8, vy:.6+Math.random()*1, r:Math.random()*6.28, s:4+Math.random()*5}; }
function burst(){
  const x = W()*(.2+Math.random()*.6), y = H()*(.12+Math.random()*.3);
  const hue = [340, 45, 200, 290, 20][Math.floor(Math.random()*5)];
  for (let i = 0; i < 70; i++){ const a = Math.random()*6.28, s = 1+Math.random()*3.5;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, hue}); }
}
let t = 0;
function loop(){
  t++;
  const w = W(), h = H();
  if (fxMode === 'fireworks'){ cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = 'rgba(0,0,0,.18)'; cx.fillRect(0,0,w,h); cx.globalCompositeOperation = 'source-over'; } else cx.clearRect(0,0,w,h);
  if (fxMode === 'rain'){
    cx.strokeStyle = 'rgba(200,215,235,.45)'; cx.lineWidth = 1;
    cx.beginPath();
    parts.forEach(p => { cx.moveTo(p.x, p.y); cx.lineTo(p.x - 2, p.y + p.l); p.y += p.v; p.x -= .6; if (p.y > h){ p.y = -20; p.x = Math.random()*w; } });
    cx.stroke();
  } else if (fxMode === 'stars'){
    parts.forEach(p => { cx.globalAlpha = .4 + .6*Math.abs(Math.sin(t/40 + p.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); });
    cx.globalAlpha = 1;
  } else if (fxMode === 'fireworks'){
    if (t % 45 === 0) burst();
    parts = parts.filter(p => p.life > 0);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.vx *= .985; p.life -= .012;
      cx.fillStyle = `hsla(${p.hue},90%,65%,${p.life})`; cx.beginPath(); cx.arc(p.x, p.y, 2, 0, 6.28); cx.fill(); });
  } else if (fxMode === 'petals'){
    parts.forEach((p, i) => { p.x += p.vx + Math.sin(t/50 + i)*.3; p.y += p.vy; p.r += .02;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = 'rgba(247,180,200,.8)';
      cx.beginPath(); cx.ellipse(0, 0, p.s, p.s*.55, 0, 0, 6.28); cx.fill(); cx.restore();
      if (p.y > h + 20) parts[i] = newPetal(false); });
  }
  raf = requestAnimationFrame(loop);
}

/* 首頁：選擇版本 */
const TITLE_TXT = {sub:$('titleSub').textContent, tag:$('titleTag').innerHTML, label:$('nameLabel').textContent};
function setMode(swap){
  S.swap = swap;
  try { localStorage.setItem('gu_mode', swap ? 'swap' : 'normal'); } catch(e){}
  document.querySelectorAll('.mode').forEach(b => b.classList.toggle('on', (b.dataset.swap === '1') === swap));
  $('titleSub').textContent = fill(TITLE_TXT.sub);
  $('titleTag').innerHTML = fill(TITLE_TXT.tag);
  $('nameLabel').textContent = fill(TITLE_TXT.label);
  const inp = $('nameInput');
  if (['蘇念', '蘇言', ''].includes(inp.value.trim())) inp.value = swap ? '蘇言' : '蘇念';
  $('titleArt').innerHTML = guArt('smirk', 't');
  renderGallery();
}
document.querySelectorAll('.mode').forEach(b => b.onclick = () => setMode(b.dataset.swap === '1'));
$('titleBg').innerHTML = sceneSVG('roof');
let savedMode = 'normal'; try { savedMode = localStorage.getItem('gu_mode') || 'normal'; } catch(e){}
setMode(savedMode === 'swap');
</script>
